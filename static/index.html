<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Assistant</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="fa-solid me-2 fa-robot brand-icon"></i>
                    <span>Antigravity AI</span>
                </div>
                <button class="icon-btn close-sidebar-btn" id="close-sidebar-btn" title="Close Sidebar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button class="btn btn-primary new-chat-btn" id="new-chat-btn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>

            <div class="sidebar-section-title">Recent Conversations</div>
            
            <div class="conversations-list" id="conversations-list">
                <!-- Conversation items populated via JS -->
            </div>

            <div class="sidebar-footer">
                <button class="sidebar-action-btn" id="open-settings-btn">
                    <i class="fa-solid fa-gear"></i> Settings
                </button>
                <button class="sidebar-action-btn text-danger" id="clear-history-btn">
                    <i class="fa-solid fa-trash-can"></i> Clear All
                </button>
            </div>
        </aside>

        <!-- Sidebar Overlay for mobile -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Main Chat Area -->
        <main class="chat-wrapper">
            <!-- Header Bar -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" title="Open Sidebar">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h2 class="chat-title" id="chat-title">New Chat</h2>
                </div>

                <div class="header-right">
                    <!-- Persona Dropdown -->
                    <div class="persona-selector">
                        <i class="fa-solid fa-user-astronaut persona-icon"></i>
                        <select id="persona-select" class="persona-dropdown" title="Select AI Persona">
                            <option value="general">🤖 General Assistant</option>
                            <option value="coder">💻 Code Expert</option>
                            <option value="math">🔢 Math Tutor</option>
                            <option value="writer">✍️ Creative Writer</option>
                            <option value="concise">⚡ Concise Bot</option>
                        </select>
                    </div>

                    <!-- Theme Toggle -->
                    <button class="icon-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme">
                        <i class="fa-solid fa-moon" id="theme-icon"></i>
                    </button>
                </div>
            </header>

            <!-- Chat Messages Container -->
            <div class="chat-messages" id="chat-messages">
                <!-- Welcome Banner (shown if no messages) -->
                <div class="welcome-banner" id="welcome-banner">
                    <div class="welcome-icon">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <h1>What can I help you with today?</h1>
                    <p>Select a persona or pick a prompt below to get started instantly.</p>
                    
                    <div class="suggestion-chips">
                        <button class="chip-btn" data-prompt="Write a Python function to reverse a string">
                            <i class="fa-solid fa-code"></i> Python Reverse String
                        </button>
                        <button class="chip-btn" data-prompt="What is sqrt(256) * 12 + 50?">
                            <i class="fa-solid fa-calculator"></i> Math Expression
                        </button>
                        <button class="chip-btn" data-prompt="Tell me a funny programmer joke!">
                            <i class="fa-solid fa-face-laugh-beam"></i> Developer Joke
                        </button>
                        <button class="chip-btn" data-prompt="What features does this AI chatbot have?">
                            <i class="fa-solid fa-lightbulb"></i> Bot Capabilities
                        </button>
                    </div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator-container hidden" id="typing-indicator">
                <div class="bot-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Chat Input Footer -->
            <footer class="chat-input-area">
                <div class="input-container">
                    <textarea 
                        id="user-input" 
                        placeholder="Message Antigravity AI... (Shift + Enter for new line)"
                        rows="1"
                    ></textarea>
                    <button id="send-btn" class="send-btn" title="Send Message">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div class="input-footer-note">
                    Antigravity AI Assistant • Built with Python & Pure Web Tech
                </div>
            </footer>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-backdrop hidden" id="settings-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-sliders"></i> AI Engine Settings</h3>
                <button class="icon-btn" id="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="provider-select">AI Provider</label>
                    <select id="provider-select" class="form-control">
                        <option value="builtin">⚡ Built-in Smart Assistant (Offline / No Key)</option>
                        <option value="gemini">✨ Google Gemini API</option>
                        <option value="openai">🧠 OpenAI API</option>
                        <option value="ollama">🦙 Ollama Local AI</option>
                    </select>
                </div>

                <div class="form-group provider-field" id="api-key-group">
                    <label for="api-key-input">API Key</label>
                    <input type="password" id="api-key-input" class="form-control" placeholder="Enter API Key...">
                </div>

                <div class="form-group provider-field" id="model-group">
                    <label for="model-name-input">Model Name</label>
                    <input type="text" id="model-name-input" class="form-control" placeholder="e.g. gemini-1.5-flash or gpt-3.5-turbo">
                </div>

                <div class="form-group provider-field" id="endpoint-group">
                    <label for="endpoint-input">Local Endpoint URL</label>
                    <input type="text" id="endpoint-input" class="form-control" placeholder="http://localhost:11434">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-settings-btn">Cancel</button>
                <button class="btn btn-primary" id="save-settings-btn">Save Preferences</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
